name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - internal/pkg
          - internal/services/auth_service
          - internal/services/user_service
    defaults:
      run:
        working-directory: ${{matrix.module}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
    
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - internal/pkg
          - internal/services/auth_service
          - internal/services/user_service
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
        
  integration:
    runs-on: ubuntu-latest
    needs: [lint,test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      
      - name: Start system
        run: docker compose up --build -d

      - name: Wait for system to startup
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8081/users/doctors/search; then exit 0; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/users/doctors/search || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 5
          done
          echo "stack did not start in time"; exit 1

      - name: Run integration test
        run: make test-integration

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      
      - name: Stop system
        if: always()
        run: docker compose down -v